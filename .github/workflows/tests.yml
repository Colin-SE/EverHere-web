name: Web checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: mysql+pymysql://album_test:ci-test-only@127.0.0.1:3306/life_album_test?charset=utf8mb4
      IDENTITY_MIGRATION_TEST_URL: mysql+pymysql://album_test:ci-test-only@127.0.0.1:3306/life_album_migration_test?charset=utf8mb4
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: life_album_test
          MYSQL_USER: album_test
          MYSQL_PASSWORD: ci-test-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock.txt
      - name: Prepare separate MySQL migration database
        run: |
          python - <<'PY'
          import pymysql
          connection = pymysql.connect(host='127.0.0.1', user='root', password='ci-root-only', autocommit=True)
          with connection.cursor() as cursor:
              cursor.execute('CREATE DATABASE life_album_migration_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci')
              cursor.execute("GRANT ALL PRIVILEGES ON life_album_migration_test.* TO 'album_test'@'%'")
          connection.close()
          PY
      - name: MySQL migration and business tests
        run: python -m pytest
