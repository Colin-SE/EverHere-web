<!doctype html>
<html lang="{{ ui_locale }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ _("云账号 · Everhere") }}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/parity.css') }}"><script type="module" src="{{ url_for('static',filename='js/login.js') }}"></script></head><body class="login-page"><main class="settings-card"><label class="language-picker"><span>{{ _("语言") }}</span><select data-language-select aria-label="{{ _("界面语言") }}"><option value="zh-CN" {% if ui_locale == "zh-CN" %}selected{% endif %}>简体中文</option><option value="en" {% if ui_locale == "en" %}selected{% endif %}>English</option></select></label><h1>{{ _("登录云账号") }}</h1><p>{{ _("使用与安卓版同一区域的账号。登录只验证身份，不上传或下载人生资料。") }}</p><form id="auth-form"><label>{{ _("云账号邮箱") }}<input name="email" type="email" autocomplete="username" required></label><label>{{ _("云账号密码") }}<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><p id="auth-error" class="form-error" role="alert"></p><button id="auth-submit" type="submit" class="button primary">{{ _("只登录账号") }}</button></form><p><a href="/">{{ _("返回本机档案 →") }}</a></p></main></body></html>
