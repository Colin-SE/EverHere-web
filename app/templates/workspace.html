<!doctype html>
<html lang="{{ ui_locale }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Everhere · {{ _('回忆与纪念') }}</title>
  <link rel="icon" href="{{ url_for('static', filename='images/mobile/app_icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/workspace.css') }}">
  <script type="module" src="{{ url_for('static', filename='js/workspace.js') }}"></script>
</head>
<body>
  <a class="skip" href="#workspace-content">{{ _('跳转至内容') }}</a>
  <header class="workspace-header">
    <a class="wordmark" href="/"><img src="{{ url_for('static', filename='images/mobile/app_icon.svg') }}" alt="">Everhere<small>{{ _('在场 · 让回忆有形') }}</small></a>
    <nav aria-label="{{ _('主要导航') }}">
      <a href="/">{{ _('人生相册') }}</a><a href="#memoirs" data-tab="memoirs">{{ _('回忆录') }}</a><a href="#shop" data-tab="shop">{{ _('文创商城') }}</a>
      <a href="#orders" data-tab="orders">{{ _('我的订单') }}</a><a href="#admin" data-tab="admin" id="admin-link" hidden>{{ _('制作与商城管理') }}</a>
    </nav>
    <div class="account-tools"><select data-language-select aria-label="{{ _('界面语言') }}"><option value="zh-CN" {% if ui_locale == 'zh-CN' %}selected{% endif %}>简体中文</option><option value="en" {% if ui_locale == 'en' %}selected{% endif %}>English</option></select><a href="#account" id="account-link">{{ _('登录 / 注册') }}</a></div>
  </header>
  <main>
    <p id="workspace-error" class="error" role="alert" hidden></p>
    <div id="workspace-content" aria-live="polite"></div>
  </main>
  <footer>Everhere · {{ _('私人记录，由你选择分享的范围') }}</footer>
</body>
</html>
